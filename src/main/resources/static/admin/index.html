<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omyohan Admin</title>
    <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
<main class="framework-picker">
    <section class="picker-hero">
        <p class="eyebrow">Omyohan Blog Admin</p>
        <h1>관리자 프론트 시안</h1>
        <p class="picker-copy">
            게시판, 메뉴, 게시글, 댓글 관리 흐름을 React와 Vue 버전으로 각각 확인할 수 있습니다.
        </p>
    </section>
    <section class="picker-grid">
        <a class="picker-card react" href="/admin/react.html">
            <span class="picker-badge">React</span>
            <h2>React 관리자 화면</h2>
            <p>카드형 대시보드와 작업 패널 중심의 관리자 UI</p>
        </a>
        <a class="picker-card vue" href="/admin/vue.html">
            <span class="picker-badge">Vue</span>
            <h2>Vue 관리자 화면</h2>
            <p>상태 요약, 게시판 관리, 메뉴 편집 흐름 중심 UI</p>
        </a>
    </section>
</main>
</body>
</html>
